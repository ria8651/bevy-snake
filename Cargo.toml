[package]
name = "bevy-snake"
version = "0.2.0"
edition = "2021"
description = "SNAKE WITH GUNS!"
default-run = "bevy-snake"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "x11",
    "bevy_gizmos",
    "webgl2",
    "png",
] }
bevy-inspector-egui = "0.30"
web-transport = "0.8"

serde = { version = "1.0", features = ["derive"] }
web-time = "1.1"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
thiserror = "2.0"
serde_json = "1.0"
futures = "0.3"
crossbeam = "0.8"
lazy_static = "1.5"
colored = "3.0"
log = "0.4"
colog = "1.3"
rustls-pemfile = "2.2"
async-channel = "2.3.1"

# wasm only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.44", features = ["macros"] }

# server only dependencies, don't work on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-transport-quinn = "0.5"
tokio = { version = "1.44", features = ["full"] }

[profile.release]
debug = true

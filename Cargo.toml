[package]
name = "bevy-snake"
version = "0.2.0"
edition = "2024"
description = "SNAKE WITH GUNS!"
default-run = "bevy-snake"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_asset",
    "bevy_state",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_input_focus",
    "bevy_picking",
    "experimental_bevy_feathers",
    "x11",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "webgl2",
    "png",
] }
lightyear = { version = "0.26", default-features = false, features = [
    "std",
    "client",
    "server",
    "netcode",
    "websocket",
    "websocket_self_signed",
    "replication",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
thiserror = "2.0"
log = "0.4"
ewebsock = "0.8"
uuid = { version = "1.4", features = ["serde"] }

# wasm-only: read window.location to derive same-origin WS URLs at runtime
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
# Lightyear's netcode pulls chacha20poly1305 -> crypto-common -> rand_core 0.6
# -> getrandom 0.2, which refuses to compile for wasm32-unknown-unknown
# unless its `js` feature is enabled. We don't use getrandom 0.2 directly;
# this dep exists only to activate that feature globally on wasm builds.
# (The top-level `getrandom = "0.3"` dep plays the same role for the 0.3
# copy that rand 0.9 pulls in, whose wasm feature is named `wasm_js`.)
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# server only dependencies, don't work on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
colog = "1.3"
nanoid = "0.4"
futures-util = "0.3"
# Outgoing WS client side of the /game reverse-proxy. The aeronet_websocket
# server downstream of the proxy uses 0.26.2 internally; this dep is the
# *client* end and doesn't need to match — they're independent.
tokio-tungstenite = "0.29"

[profile.release]
debug = true

[profile.dev.package."*"]
opt-level = 3

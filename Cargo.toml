[package]
name = "bevy-snake"
version = "0.2.0"
edition = "2024"
description = "SNAKE WITH GUNS!"
default-run = "bevy-snake"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_input_focus",
    "bevy_picking",
    "experimental_bevy_feathers",
    "x11",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "webgl2",
    "png",
] }
bevy_ggrs = "0.20"
bevy_matchbox = { version = "0.14", features = ["ggrs"] }
ggrs = "0.11"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
thiserror = "2.0"
log = "0.4"
ewebsock = "0.8"
uuid = { version = "1.4", features = ["serde"] }

# server only dependencies, don't work on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
matchbox_signaling = "0.14"
tokio-tungstenite = "0.24"
colog = "1.3"
nanoid = "0.4"
futures-util = "0.3"

[profile.release]
debug = true

[profile.dev.package."*"]
opt-level = 3

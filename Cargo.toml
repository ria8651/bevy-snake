[package]
name = "bevy-snake"
version = "0.2.0"
edition = "2024"
description = "SNAKE WITH GUNS!"
default-run = "bevy-snake"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "x11",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "webgl2",
    "png",
] }
bevy_ggrs = "0.20"
bevy_matchbox = { version = "0.14", features = ["ggrs"] }
ggrs = "0.11"

serde = { version = "1.0", features = ["derive"] }
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
thiserror = "2.0"
log = "0.4"

# server only dependencies, don't work on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
matchbox_signaling = "0.14"
colog = "1.3"

[profile.release]
debug = true

[profile.dev.package."*"]
opt-level = 3

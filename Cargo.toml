[package]
name = "bevy-snake"
version = "0.2.0"
edition = "2021"
description = "SNAKE WITH GUNS!"
default-run = "bevy-snake"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "x11",
    "bevy_gizmos",
    "webgl2",
    "png",
] }
bevy-inspector-egui = "0.30"
web-transport = "0.8"

serde = { version = "1.0", features = ["derive"] }
web-time = "1.1"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
thiserror = "2.0"
serde_json = "1.0"
crossbeam = "0.8"
lazy_static = "1.5"
colored = "3.0"
log = "0.4"
colog = "1.3"
async-select = "0.2.0"

# wasm only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.44", features = ["macros", "sync"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

# server only dependencies, don't work on wasm
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-transport-quinn = "0.5"
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
time = "0.3"
rustls-pki-types = "1"

[profile.release]
debug = true

[profile.dev.package."*"]
opt-level = 3

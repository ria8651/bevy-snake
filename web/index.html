<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --textColour: rgb(231, 231, 231);
            --mainColour: rgb(34, 34, 34);
            --secondaryColour: rgb(83, 83, 83);
            --tertiaryColour: rgba(255, 255, 255, 0.08);
            --topBar: rgba(48, 48, 48, 1.0);
            --accent: #10c2ee;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--mainColour);
            color: var(--textColour);
            font-family: "Open Sans", sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background-color: var(--mainColour);
            z-index: 1;
        }

        #loader-title {
            font-family: "Chivo", sans-serif;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            letter-spacing: 0.01em;
            color: var(--textColour);
            margin: 0 0 8px 0;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--tertiaryColour);
            text-align: center;
        }

        #loader-bar {
            width: min(320px, 60vw);
            height: 8px;
            background-color: var(--tertiaryColour);
            border-radius: 4px;
            overflow: hidden;
        }

        #loader-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 120ms linear;
        }

        #loader-text {
            font-family: "Open Sans", sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: var(--secondaryColour);
            font-variant-numeric: tabular-nums;
        }

        #loader-watermark {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(150px, 20vw);
            opacity: 0.15;
            filter: brightness(0) invert(1);
            pointer-events: none;
        }
    </style>
    <script type="module">
        import init from './bevy-snake.js'

        const wasmUrl = './bevy-snake_bg.wasm'
        const loader = document.getElementById('loader')
        const fill = document.getElementById('loader-fill')
        const text = document.getElementById('loader-text')

        const formatMB = (bytes) => (bytes / (1024 * 1024)).toFixed(1)

        async function fetchWithProgress(url) {
            const response = await fetch(url)
            if (!response.ok) throw new Error(`Failed to fetch ${url}: ${response.status}`)

            const total = Number(response.headers.get('Content-Length')) || 0
            if (!response.body || !total) return response

            let loaded = 0
            const reader = response.body.getReader()
            const stream = new ReadableStream({
                async start(controller) {
                    while (true) {
                        const { done, value } = await reader.read()
                        if (done) break
                        loaded += value.byteLength
                        const pct = (loaded / total) * 100
                        fill.style.width = pct + '%'
                        text.textContent = `Loading ${formatMB(loaded)} / ${formatMB(total)} MB`
                        controller.enqueue(value)
                    }
                    controller.close()
                },
            })

            return new Response(stream, {
                headers: response.headers,
                status: response.status,
                statusText: response.statusText,
            })
        }

        try {
            const wasmResponse = await fetchWithProgress(wasmUrl)
            text.textContent = 'Starting…'
            fill.style.width = '100%'
            await init(wasmResponse)
        } catch (error) {
            if (!error.message?.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
                text.textContent = 'Failed to load: ' + error.message
                throw error
            }
        }
        loader.remove()
    </script>
    <script>
        document.body.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
        // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward

        // the following function keeps track of all AudioContexts and resumes them on the first user
        // interaction with the page. If the function is called and all contexts are already running,
        // it will remove itself from all event listeners.
        (function () {
            // An array of all contexts to resume on the page
            const audioContextList = [];

            // An array of various user interaction events we should listen for
            const userInputEventNames = [
                "click",
                "contextmenu",
                "auxclick",
                "dblclick",
                "mousedown",
                "mouseup",
                "pointerup",
                "touchend",
                "keydown",
                "keyup",
            ];

            // A proxy object to intercept AudioContexts and
            // add them to the array for tracking and resuming later
            self.AudioContext = new Proxy(self.AudioContext, {
                construct(target, args) {
                    const result = new target(...args);
                    audioContextList.push(result);
                    return result;
                },
            });

            // To resume all AudioContexts being tracked
            function resumeAllContexts(_event) {
                let count = 0;

                audioContextList.forEach((context) => {
                    if (context.state !== "running") {
                        context.resume();
                    } else {
                        count++;
                    }
                });

                // If all the AudioContexts have now resumed then we unbind all
                // the event listeners from the page to prevent unnecessary resume attempts
                // Checking count > 0 ensures that the user interaction happens AFTER the game started up
                if (count > 0 && count === audioContextList.length) {
                    userInputEventNames.forEach((eventName) => {
                        document.removeEventListener(eventName, resumeAllContexts);
                    });
                }
            }

            // We bind the resume function for each user interaction
            // event on the page
            userInputEventNames.forEach((eventName) => {
                document.addEventListener(eventName, resumeAllContexts);
            });
        })();
    </script>
</head>

<body>
    <div id="loader">
        <img id="loader-watermark" src="./assets/images/banner-flat.svg" alt="" />
        <h1 id="loader-title">Snake, BUT WITH GUNS!!!</h1>
        <div id="loader-bar"><div id="loader-fill"></div></div>
        <div id="loader-text">Loading…</div>
    </div>
    <canvas id="bevy" style="width: 100%; height: 100%;"></canvas>
</body>

</html>
